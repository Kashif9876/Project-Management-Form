<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="jpdb-commons.js"></script>
</head>

<body>
    <h2>Project Management Form</h2>

    <form id="projectForm" method="post">
        <div class="form-group">
            <label for="projectId">Project ID:</label>
            <input type="text" id="projectId" placeholder="Enter Project ID" onchange="getProject()">
        </div>

        <div class="form-group">
            <label for="projectName">Project Name:</label>
            <input type="text" id="projectName" placeholder="Enter Project Name" disabled>
        </div>

        <div class="form-group">
            <label for="assignedTo">Assigned To:</label>
            <input type="text" id="assignedTo" placeholder="Enter Assignee Name" disabled>
        </div>

        <div class="form-group">
            <label for="assignmentDate">Assignment Date:</label>
            <input type="date" id="assignmentDate" disabled>
        </div>

        <div class="form-group">
            <label for="deadline">Deadline:</label>
            <input type="date" id="deadline" disabled>
        </div>

        <div class="buttons">
            <button type="button" id="save" onclick="saveData()" disabled>Save</button>
            <button type="button" id="update" onclick="updateData()" disabled>Update</button>
            <button type="button" id="reset" onclick="resetForm()" disabled>Reset</button>
        </div>
    </form>

    <script src="script.js"></script>
</body>

</html>
